<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>รากมหัศจรรย์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#160f0a;
    --bg-panel:#20160f;
    --bg-panel-2:#2a1c12;
    --root-cream:#eadfc7;
    --root-cream-dim:#a99a80;
    --accent-glow:#b7e08a;
    --accent-glow-dim:#7ea35c;
    --accent-amber:#e0a94a;
    --line-soil:#3a2a1c;
    --prestige-accent:#b78cf0;
    --prestige-accent-dim:#8a68b8;
    --prestige-bg:#1c1526;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse at 50% 0%, #2a1d13 0%, var(--bg-deep) 60%);
    color:var(--root-cream);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:stretch;
    justify-content:center;
    touch-action:manipulation;
  }
  .app{
    width:100%;
    max-width:1100px;
    display:grid;
    grid-template-columns:1fr 340px;
    gap:18px;
    padding:22px;
  }
  @media (min-width:761px){
    #shopList{
      max-height:460px;
      overflow-y:auto;
      padding-right:6px;
      margin-right:-6px;
    }
    #shopList::-webkit-scrollbar{ width:7px; }
    #shopList::-webkit-scrollbar-track{ background:transparent; }
    #shopList::-webkit-scrollbar-thumb{
      background:var(--line-soil);
      border-radius:6px;
    }
    #shopList::-webkit-scrollbar-thumb:hover{ background:var(--accent-glow-dim); }
    #shopList .qty-bar{
      position:sticky;
      top:0;
      background:linear-gradient(180deg, var(--bg-deep) 80%, transparent);
      padding-bottom:8px;
      z-index:2;
    }
  }
  @media (max-width:760px){
    .app{grid-template-columns:1fr; padding:14px;}
  }
  header{
    grid-column:1/-1;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:8px;
    border-bottom:1px solid var(--line-soil);
    padding-bottom:14px;
    margin-bottom:4px;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:28px;
    margin:0;
    letter-spacing:0.3px;
    color:var(--root-cream);
  }
  h1 span{color:var(--accent-glow);}
  .subtitle{
    font-size:12.5px;
    color:var(--root-cream-dim);
    margin-top:2px;
  }
  .stats{
    text-align:right;
    font-family:'JetBrains Mono',monospace;
  }
  .stats .amount{
    font-size:24px;
    font-weight:600;
    color:var(--accent-amber);
  }
  .stats .rate{
    font-size:12px;
    color:var(--accent-glow-dim);
  }
  .stage{
    background:linear-gradient(180deg, #241a12 0%, #1a1109 70%, #120b06 100%);
    border:1px solid var(--line-soil);
    border-radius:14px;
    position:relative;
    overflow-y:auto;
    overflow-x:hidden;
    height:460px;
    max-height:70vh;
  }
  .stage::before{
    /* soil texture line near top */
    content:"";
    position:absolute;
    top:0; left:0; right:0; height:1px;
    background:linear-gradient(90deg, transparent, var(--line-soil), transparent);
    z-index:2;
  }
  .stage-topbar{
    position:sticky;
    top:12px;
    z-index:3;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:8px;
    padding:0 16px;
    margin-top:12px;
    pointer-events:none;
  }
  .stage-label{
    display:inline-block;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--root-cream-dim);
    font-family:'JetBrains Mono',monospace;
    opacity:0.85;
    background:rgba(20,14,9,0.55);
    padding:3px 8px;
    border-radius:6px;
    backdrop-filter:blur(2px);
  }
  .buff-badge{
    display:inline-block;
    font-size:11px;
    font-family:'JetBrains Mono',monospace;
    color:#ffd76a;
    background:rgba(40,30,10,0.6);
    padding:3px 8px;
    border-radius:6px;
    backdrop-filter:blur(2px);
    max-width:190px;
    text-align:right;
    line-height:1.4;
  }
  .top-actions-row{
    grid-column:1/-1;
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:8px;
  }
  .utility-btn-group{
    display:flex;
    align-items:center;
    gap:8px;
    margin-left:auto;
  }
  .utility-divider{
    width:1px;
    height:20px;
    background:var(--line-soil);
    margin:0 2px;
  }
  .skin-toggle-btn{
    background:var(--bg-panel-2);
    border:1px solid var(--accent-amber);
    color:var(--accent-amber);
    font-size:14px;
    width:30px; height:30px;
    border-radius:50%;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:filter .15s, transform .15s;
  }
  .skin-toggle-btn.on{
    border-color:transparent;
    background:conic-gradient(from 180deg, #ff6b6b, #ffd76a, #8fd17a, #6ab7ff, #b78cf0, #ff6b6b);
    color:#1c1526;
    box-shadow:0 0 10px rgba(255,215,106,0.5);
  }
  .skin-toggle-btn:hover{ filter:brightness(1.15); transform:scale(1.06); }
  svg#rootCanvas{width:100%; display:block;}
  .branch{
    fill:none;
    stroke-linecap:round;
  }
  .particle{
    fill:var(--accent-glow);
    opacity:0;
  }
  .panel{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .panel-title{
    font-family:'Fraunces',serif;
    font-size:15px;
    color:var(--root-cream-dim);
    margin:0 0 2px 2px;
    letter-spacing:0.4px;
  }
  .module{
    background:var(--bg-panel);
    border:1px solid var(--line-soil);
    border-radius:10px;
    padding:12px 13px;
    cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
    user-select:none;
    position:relative;
  }
  .module:hover:not(.disabled){
    border-color:var(--accent-glow-dim);
    background:var(--bg-panel-2);
  }
  .module:active:not(.disabled){transform:scale(0.98);}
  .module.disabled{opacity:0.45; cursor:not-allowed;}
  .module.has-hovercard.disabled{opacity:1;}
  .module.has-hovercard.disabled .module-body{opacity:0.45;}
  .module-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:8px;
  }
  .module-name{
    font-weight:600;
    font-size:14px;
    color:var(--root-cream);
  }
  .module-owned{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--accent-glow-dim);
  }
  .module-desc{
    font-size:11.5px;
    color:var(--root-cream-dim);
    margin-top:3px;
    line-height:1.4;
  }
  .module-bottom{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
  }
  .module-cost{color:var(--accent-amber);}
  .module-rate{color:var(--accent-glow-dim);}
  .module-rate.boosted{ color:var(--accent-glow); font-weight:700; }
  .module-hovercard{
    position:absolute;
    left:0; right:0;
    top:calc(100% + 6px);
    background:var(--bg-panel-2);
    border:1px solid var(--accent-glow-dim);
    border-radius:8px;
    padding:10px 12px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    box-shadow:0 10px 28px rgba(0,0,0,0.55);
    z-index:12;
    opacity:0;
    visibility:hidden;
    transform:translateY(-4px);
    transition:opacity .15s ease, transform .15s ease;
    pointer-events:none;
    text-align:left;
  }
  .module:hover .module-hovercard{
    opacity:1;
    visibility:visible;
    transform:translateY(0);
  }
  .module-hovercard.above{
    top:auto;
    bottom:calc(100% + 6px);
  }
  .mh-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    color:var(--root-cream-dim);
    padding:2px 0;
  }
  .mh-row b{ font-weight:700; color:var(--root-cream); }
  .mh-row.mh-highlight b{ color:var(--accent-glow); }
  .mh-divider{ border-top:1px dashed var(--line-soil); margin:4px 0; }
  .qty-bar{
    display:flex;
    gap:6px;
    margin-bottom:2px;
  }
  .qty-btn{
    flex:1;
    background:var(--bg-panel);
    border:1px solid var(--line-soil);
    color:var(--root-cream-dim);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:7px 0;
    border-radius:8px;
    cursor:pointer;
    transition:border-color .15s, color .15s, background .15s;
  }
  .qty-btn:hover{border-color:var(--accent-glow-dim); color:var(--root-cream);}
  .qty-btn.active{
    background:var(--accent-glow-dim);
    border-color:var(--accent-glow-dim);
    color:#12190d;
    font-weight:600;
  }
  .module.rootupgrade{border-style:dashed;}
  .module.rootupgrade.milestone{
    border-style:solid;
    border-left-width:4px;
    background:linear-gradient(180deg, var(--bg-panel) 0%, rgba(224,169,74,0.10) 100%);
  }
  .module.rootupgrade.milestone .module-rate{ color:var(--accent-amber); font-weight:700; }
  .module.echo{
    background:linear-gradient(180deg, var(--bg-panel) 0%, rgba(183,224,138,0.07) 100%);
  }
  .rate.seeds{ color:var(--prestige-accent); }

  .game-event{
    position:absolute;
    width:52px; height:52px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:24px;
    cursor:pointer;
    border:none;
    background:radial-gradient(circle at 35% 30%, #4a3a24, #2a1d10);
    box-shadow:0 0 0 2px var(--accent-amber), 0 0 18px rgba(224,169,74,0.55);
    animation:eventPulse 1.1s ease-in-out infinite;
    z-index:6;
    padding:0;
  }
  .game-event.lucky{
    background:radial-gradient(circle at 35% 30%, #5a4310, #2a1d05);
    box-shadow:0 0 0 2px #ffd76a, 0 0 26px rgba(255,215,106,0.85);
    animation:eventPulseLucky 0.7s ease-in-out infinite;
  }
  .game-event.fading{ animation:none; opacity:0; transform:scale(0.6); transition:opacity .4s, transform .4s; }
  @keyframes eventPulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.12); }
  }
  @keyframes eventPulseLucky{
    0%,100%{ transform:scale(1) rotate(0deg); }
    50%{ transform:scale(1.2) rotate(8deg); }
  }
  .floating-text{
    position:absolute;
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    font-size:15px;
    pointer-events:none;
    z-index:7;
    text-shadow:0 2px 6px rgba(0,0,0,0.6);
    animation:floatUp 1.6s ease-out forwards;
  }
  @keyframes floatUp{
    0%{ opacity:0; transform:translateY(0) scale(0.8); }
    15%{ opacity:1; transform:translateY(-6px) scale(1.05); }
    100%{ opacity:0; transform:translateY(-46px) scale(1); }
  }

  .footer-note.playtime-note{ margin-bottom:4px; opacity:0.85; }
  .prestige-mini-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--prestige-bg);
    border:1px solid var(--prestige-accent-dim);
    color:var(--prestige-accent);
    font-size:12px;
    font-family:'Inter',sans-serif;
    padding:6px 14px;
    border-radius:20px;
    cursor:pointer;
    box-shadow:0 0 12px rgba(183,140,240,0.15);
  }
  .prestige-mini-btn:hover{ background:var(--prestige-accent-dim); color:#1c1526; }
  .prestige-item{
    background:var(--prestige-bg);
    border:1px solid var(--prestige-accent-dim);
    border-radius:10px;
    padding:11px 13px;
    margin-bottom:8px;
    cursor:pointer;
    transition:border-color .15s, transform .1s;
  }
  .prestige-item:hover:not(.disabled){ border-color:var(--prestige-accent); }
  .prestige-item:active:not(.disabled){ transform:scale(0.98); }
  .prestige-item.disabled{ opacity:0.4; cursor:not-allowed; }
  .prestige-item.owned{ opacity:0.6; cursor:default; }
  .prestige-item.skin-active{
    border-color:var(--accent-glow);
    box-shadow:inset 0 0 0 1px var(--accent-glow);
  }
  .danger-btn{
    width:100%;
    background:transparent;
    border:1px solid #a84343;
    color:#e08a8a;
    padding:10px 0;
    border-radius:8px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .danger-btn:hover{ background:rgba(168,67,67,0.15); }
  .slot-item .modal-actions{ justify-content:flex-start; margin-top:8px; }
  .slot-item .modal-actions button{ padding:6px 14px; font-size:12px; }
  .danger-inline{ color:#e08a8a; border-color:#a84343; }
  .prestige-item.toggled-off{ opacity:0.55; }
  .prestige-item .p-top{ display:flex; justify-content:space-between; font-weight:600; font-size:13.5px; }
  .prestige-item .p-desc{ font-size:11.5px; color:var(--root-cream-dim); margin-top:4px; line-height:1.4; }
  .prestige-item .p-cost{
    font-family:'JetBrains Mono',monospace; font-size:12px;
    color:var(--prestige-accent); margin-top:6px;
  }
  .prestige-section-header{
    font-family:'Fraunces',serif;
    font-size:12.5px;
    letter-spacing:0.5px;
    color:var(--prestige-accent);
    text-transform:uppercase;
    margin:16px 0 8px;
    padding-bottom:4px;
    border-bottom:1px solid var(--prestige-accent-dim);
  }
  .prestige-section-header:first-child{ margin-top:0; }
  .upgrade-hint{
    font-size:11.5px;
    color:var(--root-cream-dim);
    opacity:0.6;
    padding:8px 2px;
    text-align:center;
  }
  .offline-backdrop{
    position:fixed; inset:0;
    background:rgba(10,7,4,0.72);
    display:flex; align-items:center; justify-content:center;
    z-index:50;
    padding:20px;
  }
  .offline-modal{
    background:var(--bg-panel);
    border:1px solid var(--line-soil);
    border-radius:14px;
    padding:26px 24px;
    max-width:340px;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .modal-wrapper{
    position:relative;
    max-width:340px;
    width:100%;
  }
  .modal-close-x{
    position:absolute;
    top:-10px; right:-10px;
    background:var(--bg-panel-2);
    border:1px solid var(--line-soil);
    color:var(--root-cream-dim);
    font-size:18px;
    line-height:1;
    width:30px; height:30px;
    border-radius:50%;
    cursor:pointer;
    z-index:5;
    display:flex; align-items:center; justify-content:center;
  }
  .modal-close-x:hover{ color:var(--root-cream); border-color:var(--prestige-accent-dim); }
  .offline-modal::-webkit-scrollbar{ width:7px; }
  .offline-modal::-webkit-scrollbar-track{ background:transparent; }
  .offline-modal::-webkit-scrollbar-thumb{ background:var(--line-soil); border-radius:6px; }
  .offline-modal::-webkit-scrollbar-thumb:hover{ background:var(--prestige-accent-dim); }
  .offline-modal .icon{font-size:32px; margin-bottom:6px;}
  .offline-modal h2{
    font-family:'Fraunces',serif;
    font-size:19px;
    margin:0 0 6px;
    color:var(--root-cream);
  }
  .offline-modal .away-time{
    font-size:12.5px;
    color:var(--root-cream-dim);
    margin-bottom:14px;
  }
  .offline-modal .gain{
    font-family:'JetBrains Mono',monospace;
    font-size:26px;
    font-weight:600;
    color:var(--accent-amber);
    margin:6px 0 18px;
  }
  .offline-modal button{
    background:var(--accent-glow-dim);
    color:#12190d;
    border:none;
    padding:11px 28px;
    border-radius:9px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .offline-modal button:hover{filter:brightness(1.08);}
  .save-btn-mini{
    background:var(--bg-panel-2);
    border:1px solid var(--line-soil);
    color:var(--root-cream-dim);
    font-size:14px;
    width:30px; height:30px;
    border-radius:50%;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .save-btn-mini:hover{border-color:var(--accent-glow-dim); color:var(--root-cream);}
  #genericModalBody textarea{
    width:100%; height:90px;
    background:#1a120c; color:var(--root-cream);
    border:1px solid var(--line-soil); border-radius:8px;
    padding:8px; font-family:'JetBrains Mono',monospace; font-size:11px;
    margin-bottom:10px; resize:none;
  }
  #genericModalBody .modal-actions{display:flex; gap:8px; justify-content:center;}
  #genericModalBody .modal-actions button.secondary{
    background:var(--bg-panel-2); color:var(--root-cream);
  }
  #genericModalBody .import-error{
    color:#e08a8a; font-size:12px; min-height:16px; margin:2px 0 10px;
  }
  .footer-note{
    font-size:11px;
    color:var(--root-cream-dim);
    opacity:0.6;
    text-align:center;
    margin-top:6px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>ราก<span>มหัศจรรย์</span></h1>
      <div class="subtitle">รดน้ำ รอ และดูรากแผ่ขยายเองไปเรื่อยๆ — ซื้อรากเสริมเพื่อเร่งการเติบโต</div>
    </div>
    <div class="stats">
      <div class="amount" id="nutrientDisplay">0</div>
      <div class="rate" id="rateDisplay">+0.0 สารอาหาร/วิ</div>
      <div class="rate seeds" id="seedsDisplay" style="display:none;"></div>
    </div>
  </header>

  <div class="top-actions-row">
    <button class="prestige-mini-btn" id="prestigeBtn" style="display:none;">🌌 Prestige</button>
    <div class="utility-btn-group">
      <button class="skin-toggle-btn" id="auraToggleBtn" style="display:none;" title="เปิด/ปิดสกินรากออร่า">🎨</button>
      <div class="utility-divider"></div>
      <button class="save-btn-mini" id="optionsBtn" title="ตัวเลือก">⚙️</button>
    </div>
  </div>

  <div class="stage" id="stageBox">
    <div class="stage-topbar">
      <div class="stage-label" id="stageLabel">ระยะเมล็ด</div>
      <div class="buff-badge" id="buffDisplay" style="display:none;"></div>
    </div>
    <svg id="rootCanvas" viewBox="0 0 500 480" preserveAspectRatio="xMidYMin meet"></svg>
  </div>

  <div class="panel">
    <div class="panel-title">รากเสริม</div>
    <div id="shopList"></div>
    <div class="footer-note playtime-note" id="playTimeDisplay">⏱️ เล่นมาแล้ว 0 วินาที</div>
    <div class="footer-note">บันทึกอัตโนมัติ · ปิดแอปได้ เปิดมาใหม่รากยังทำงานให้ · เลื่อนดูรากด้านล่างได้</div>
  </div>
</div>

<div class="offline-backdrop" id="offlineBackdrop" style="display:none;">
  <div class="offline-modal">
    <div class="icon">🌿</div>
    <h2>ยินดีต้อนรับกลับ</h2>
    <div class="away-time" id="awayTimeText">คุณหายไป —</div>
    <div class="gain" id="offlineGainText">+0</div>
    <button id="claimOfflineBtn">เก็บผลผลิต</button>
  </div>
</div>

<div class="offline-backdrop" id="genericBackdrop" style="display:none;">
  <div class="modal-wrapper">
    <button class="modal-close-x" id="genericCloseX" aria-label="ปิด">&times;</button>
    <div class="offline-modal" id="genericModalBody"></div>
  </div>
</div>

<script>
(function(){
  const NS = "http://www.w3.org/2000/svg";
  const canvas = document.getElementById('rootCanvas');
  const stageBox = document.getElementById('stageBox');
  const nutrientDisplay = document.getElementById('nutrientDisplay');
  const rateDisplay = document.getElementById('rateDisplay');
  const seedsDisplay = document.getElementById('seedsDisplay');
  const buffDisplay = document.getElementById('buffDisplay');
  const auraToggleBtn = document.getElementById('auraToggleBtn');
  const playTimeDisplay = document.getElementById('playTimeDisplay');
  const prestigeBtn = document.getElementById('prestigeBtn');
  const stageLabel = document.getElementById('stageLabel');
  const shopList = document.getElementById('shopList');
  const offlineBackdrop = document.getElementById('offlineBackdrop');
  const awayTimeText = document.getElementById('awayTimeText');
  const offlineGainText = document.getElementById('offlineGainText');
  const claimOfflineBtn = document.getElementById('claimOfflineBtn');
  const genericBackdrop = document.getElementById('genericBackdrop');
  const genericModalBody = document.getElementById('genericModalBody');
  const optionsBtn = document.getElementById('optionsBtn');

  const BASE_RATE = 0.15;
  const SEED = 918273;

  const MODULE_DEFS = [
    { id:'fine',   name:'รากฝอย',            desc:'รากเล็กจิ๋วที่แทรกดินหาความชื้น', baseCost:10,        costMult:1.15, rate:0.6,   color:'#eadfc7' },
    { id:'nodule', name:'ปมราก',             desc:'กักเก็บสารอาหารไว้ใช้ต่อเนื่อง',   baseCost:80,        costMult:1.17, rate:4,     color:'#e0a94a' },
    { id:'myco',   name:'เชื้อราไมคอร์ไรซา', desc:'ทำงานร่วมกับรากเพื่อดูดซึมสารอาหารเพิ่ม', baseCost:600,       costMult:1.19, rate:22,    color:'#8fd17a' },
    { id:'core',   name:'แก่นราก',           desc:'แกนรากลึกที่สูบสารอาหารมหาศาลจากใต้ดิน', baseCost:5000,      costMult:1.22, rate:120,   color:'#d1673f' },
    { id:'vine',   name:'เถารากยักษ์',       desc:'เถารากที่ชอนไชไปทั่วชั้นดินลึก',   baseCost:45000,     costMult:1.24, rate:720,   color:'#5fa8d1' },
    { id:'bionode',name:'ปมพลังงานชีวภาพ',   desc:'แปลงสารอินทรีย์เป็นพลังงานเข้มข้น', baseCost:400000,    costMult:1.26, rate:4800,  color:'#c77dd1' },
    { id:'eternal',name:'รากอมตะ',           desc:'รากโบราณที่ไม่เคยหยุดเติบโต',      baseCost:3600000,   costMult:1.28, rate:32000, color:'#f2d24a' },
    { id:'nexus',  name:'แก่นโลกใต้ดิน',     desc:'เชื่อมต่อกับแหล่งพลังงานใจกลางโลก', baseCost:32000000,  costMult:1.30, rate:210000,color:'#ff6b6b' },
    { id:'crystal',name:'ใยรากคริสตัล',      desc:'โครงสร้างรากที่ตกผลึกดูดพลังงานสูง', baseCost:290000000,   costMult:1.32, rate:1400000,   color:'#8ad6e0' },
    { id:'heart',  name:'หัวใจราก',          desc:'ศูนย์กลางที่สูบฉีดพลังงานทั่วเครือข่ายราก', baseCost:2600000000,  costMult:1.34, rate:9200000,   color:'#ff9ecf' },
    { id:'seed',   name:'เมล็ดพันธุ์อนันต์', desc:'เมล็ดที่งอกซ้ำได้ไม่รู้จบ',        baseCost:23000000000, costMult:1.36, rate:60000000,  color:'#c8e06a' },
    { id:'throne', name:'บัลลังก์ราก',       desc:'จุดสูงสุดของเครือข่ายรากทั้งหมด',   baseCost:210000000000,costMult:1.38, rate:400000000, color:'#e0c168' },
  ];
  const MODULE_COLOR = {};
  MODULE_DEFS.forEach(m => MODULE_COLOR[m.id] = m.color);

  // Root Upgrade: ONE unified, unlimited-level repeatable purchase per
  // module (merges what used to be two separate systems — "upgrade" and
  // "fertilizer"). Levels 1-4, 6-9, 11-14... each give a flat +30%; every
  // 5th purchase (5, 10, 15...) is a x2 milestone. Cost is priced directly
  // against the benefit it gives (with a discount), so it's always
  // deliberately CHEAPER than just buying the equivalent number of raw
  // units for the same rate gain — otherwise it's a strictly worse choice
  // than plain buying, which is what made it feel pointless before.
  const ROOT_UPGRADE_MILESTONE_MULT = 2.0;
  const ROOT_UPGRADE_NORMAL_MULT = 1.3;
  const ROOT_UPGRADE_DISCOUNT = 0.55; // lower = bigger discount vs. raw-unit-equivalent cost
  function rootUpgradeRequireOwned(level){
    return Math.round(10 * Math.pow(1.55, level-1));
  }
  function rootUpgradeIsMilestone(level){
    return level % 5 === 0;
  }
  function rootUpgradeLevelMult(level){
    return rootUpgradeIsMilestone(level) ? ROOT_UPGRADE_MILESTONE_MULT : ROOT_UPGRADE_NORMAL_MULT;
  }
  function rootUpgradeEquivUnits(level){
    const req = rootUpgradeRequireOwned(level);
    const benefitFraction = rootUpgradeLevelMult(level) - 1; // 0.3 normal, 1.0 milestone
    return Math.max(1, Math.round(req * benefitFraction * ROOT_UPGRADE_DISCOUNT));
  }
  function rootUpgradeCost(def, level){
    return bulkCostFor(def, rootUpgradeRequireOwned(level), rootUpgradeEquivUnits(level));
  }
  function rootUpgradeMultiplier(moduleId){
    const level = state.rootUpgrades[moduleId] || 0;
    let mult = 1;
    for(let i=1; i<=level; i++) mult *= rootUpgradeLevelMult(i);
    return mult;
  }

  // Root Echo: repeatable purchase per module (unlocked once you own a lot of
  // it) that boosts the GLOBAL total rate — every module, not just this one —
  // by a flat +1% each time, permanently. Priced as "N seconds of your
  // current total production" rather than off the module's own cost curve,
  // so it always stays proportional to actual progress no matter how late
  // you unlock it or how much your economy has grown since. Repeats of the
  // same module still multiply steeply so it doesn't get spammed on one type.
  const ECHO_REQUIRE_OWNED = 100;
  const ECHO_BASE_SECONDS = 200; // first purchase of a type costs ~this many seconds of current total rate
  const ECHO_COST_MULT = 4;

  // Echo for a module unlocks only once you've also reached the first x2
  // milestone (level 5) in its Root Upgrade track — the track's own %
  // bonuses become tiny in absolute terms once you've moved on to newer
  // tiers, but they now matter as the required stepping stone toward that
  // module's Echo, which stays powerful (a global bonus) no matter how old
  // the tier is.
  const ECHO_REQUIRE_UPGRADE_LEVEL = 5;
  function echoUnlockedFor(moduleId){
    return state.owned[moduleId] >= ECHO_REQUIRE_OWNED
      && (state.rootUpgrades[moduleId] || 0) >= ECHO_REQUIRE_UPGRADE_LEVEL;
  }

  // ---------- Prestige ----------
  // Unlocks once the player has meaningfully entered late-game (5+ Echo
  // purchases across any modules, or at least one top-tier root). Resets the
  // current run in exchange for a permanent currency; Echoes survive the reset.
  const PRESTIGE_UNLOCK_ECHOES = 5;
  const SEED_DIVIDER = 1000000; // tune this against real playtest data
  const OFFLINE_CAP_HOURS = [24, 48, 72];

  function createFreshState(){
    const s = {
      nutrients: 0,
      owned: {},
      totalOwned: 0,
      rootUpgrades: {}, // moduleId -> level count (unified upgrade+fertilizer track)
      echoes: {},
      buyQty: 1,
      lockGapBackfilled: false, // one-time migration flag, see backfillUnlockGaps()
      totalPlayTimeSeconds: 0, // lifetime, persists across sessions AND prestige — only counts time the tab was actually open
      runPlayTimeSeconds: 0,   // resets on Prestige — time played in the current run
      runEarned: 0,      // nutrients earned since the last prestige (basis for seed payout)
      eternalSeeds: 0,   // permanent prestige currency
      prestige: {
        starterLevel: 0,   // free "fine" roots granted on reset = starterLevel*10
        autoRoot: false,   // auto-buys the cheapest affordable root every 2s
        autoRootSmart: false, // upgrade: switches auto-buy strategy to best value instead of cheapest
        autoRootAll: false,   // upgrade: also auto-buys upgrades, fertilizer, and echo (not just base modules)
        goldenLevel: 0,    // +5% eternal seeds earned per level
        auraRoots: false,  // cosmetic: rainbow/gold root coloring (ownership, permanent)
        auraRootsEnabled: true, // legacy, superseded by activeSkin (kept for one-time migration on old saves)
        skinSameOrigin: false, // owned: each major fork keeps its own color family
        skinGrayscale: false,  // owned: black & white, shading by depth
        skinGradient: false,   // owned: single hue, dark->light gradient by depth
        activeSkin: 'none',    // 'none' | 'rainbow' | 'sameorigin' | 'grayscale' | 'gradient' — cycles on toggle click
        autoReset: false,      // auto-Prestiges once a reset would yield >= AUTO_RESET_MIN_SEEDS (ownership, permanent)
        autoResetEnabled: true, // whether the owned feature is currently switched ON
        offlineCapLevel: 0, // index into OFFLINE_CAP_HOURS
        eventBonusLevel: 0,   // +20% event reward magnitude per level
        eventDurationLevel: 0, // +15% event buff/lucky duration per level
        autoEvent: false,     // auto-clicks any spawned event shortly after it appears
        luckyMagnitudeLevel: 0, // each level: lucky's ×777 gets an extra ×(level+1) layered on top
        luckyDurationLevel: 0,  // each level: lucky's 7s duration gets an extra ×(level+1) layered on top (capped)
        luckyChanceLevel: 0,    // each level: +0.7pp chance for the lucky event type (capped at 7%)
        passiveRateLevel: 0     // each level: +1% total rate, flat 100-seed cost, unlimited
      }
    };
    MODULE_DEFS.forEach(m => s.owned[m.id] = 0);
    return s;
  }
  let state = createFreshState();

  // ---------- seeded RNG ----------
  function mulberry32(seed){
    return function(){
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rng = mulberry32(SEED);

  // ---------- root branch generation (deterministic, replayed from purchase log) ----------
  let branches = []; // {x1,y1,x2,y2,depth,width,children,moduleId}
  const CX = 250, CY = 14;
  let maxY = CY + 42;

  function seedTrunk(){
    branches = [{
      x1:CX, y1:CY, x2:CX, y2:CY+42, depth:0, width:7, children:0, moduleId:null, parentIndex:null
    }];
    maxY = CY + 42;
  }

  function angleOf(b){ return Math.atan2(b.y2-b.y1, b.x2-b.x1); }

  function addBranch(moduleId){
    // weighted pick: prefer tips with fewer children
    let weights = branches.map(b => 1/(1+b.children*1.6));
    let total = weights.reduce((a,b)=>a+b,0);
    let r = rng()*total, idx = 0;
    for(let i=0;i<branches.length;i++){ r -= weights[i]; if(r<=0){ idx=i; break; } idx=i; }
    const parent = branches[idx];
    parent.children++;

    const depth = parent.depth+1;
    const baseAngle = angleOf(parent);
    const spread = 0.55 + Math.min(depth*0.05, 0.5);
    const newAngle = baseAngle + (rng()-0.5)*spread;
    let len = Math.max(9, 46 - depth*3.1) * (0.75 + rng()*0.5);
    let width = Math.max(0.9, 6.2 - depth*0.45);

    let nx = parent.x2 + Math.cos(newAngle)*len;
    let ny = parent.y2 + Math.sin(newAngle)*len;

    // keep within horizontal bounds only; vertical grows freely (canvas scrolls)
    nx = Math.max(20, Math.min(480, nx));
    ny = Math.max(18, ny);

    branches.push({ x1:parent.x2, y1:parent.y2, x2:nx, y2:ny, depth, width, children:0, moduleId, parentIndex: idx });
    if(ny > maxY) maxY = ny;
  }

  function resizeCanvas(){
    const targetH = Math.max(480, maxY + 60);
    canvas.setAttribute('viewBox', `0 0 500 ${targetH}`);
  }

  // Derives a canonical, deterministic build order purely from owned counts
  // (no need to remember the real purchase history). Uses a weighted
  // round-robin so colors interleave proportionally instead of clumping into
  // one big block per type. Same counts always produce the same order.
  function deriveLog(owned){
    const ids = MODULE_DEFS.map(d => d.id);
    const counts = ids.map(id => owned[id] || 0);
    const total = counts.reduce((a,b)=>a+b, 0);
    if(total === 0) return [];
    const acc = counts.map(()=>0);
    const log = [];
    for(let step=0; step<total; step++){
      for(let i=0;i<counts.length;i++) acc[i] += counts[i];
      let best = 0;
      for(let i=1;i<counts.length;i++) if(acc[i] > acc[best]) best = i;
      acc[best] -= total;
      log.push(ids[best]);
    }
    return log;
  }

  function rebuildBranches(log, animateNew){
    seedTrunk();
    log.forEach(id => addBranch(id));
    resizeCanvas();
    render(animateNew ? [branches.length-1] : []);
  }

  function findLineageRoot(i){
    // walk up the parent chain to find the depth-1 ancestor (the first
    // fork off the trunk) — branches sharing that ancestor share a color
    let idx = i;
    while(branches[idx] && branches[idx].depth > 1 && branches[idx].parentIndex != null){
      idx = branches[idx].parentIndex;
    }
    return idx;
  }

  function getBranchColor(b, i){
    const skin = state.prestige ? state.prestige.activeSkin : 'none';
    if(i === 0){
      // trunk
      if(skin === 'rainbow') return '#f2d24a';
      if(skin === 'grayscale') return '#d8d8d8';
      if(skin === 'gradient') return '#e8dcc8';
      if(skin === 'sameorigin') return '#e8dcc8';
      return '#c9b48a';
    }
    if(skin === 'rainbow') return `hsl(${(i*47)%360},75%,68%)`;
    if(skin === 'grayscale'){
      const light = 22 + Math.min(b.depth,12)*5; // darker near trunk, lighter at tips
      return `hsl(0,0%,${light}%)`;
    }
    if(skin === 'gradient'){
      const light = 20 + Math.min(b.depth,14)*4.5; // earthy green, dark->light by depth
      return `hsl(95,32%,${light}%)`;
    }
    if(skin === 'sameorigin'){
      const rootIdx = findLineageRoot(i);
      const hue = (rootIdx*67) % 360; // each major fork gets its own hue
      const light = 52 + Math.min(b.depth,10)*2.2;
      return `hsl(${hue},58%,${light}%)`;
    }
    return MODULE_COLOR[b.moduleId] || 'var(--root-cream)';
  }

  function render(animateIndices){
    const animateSet = new Set(animateIndices || []);
    canvas.innerHTML = '';
    branches.forEach((b, i) => {
      const path = document.createElementNS(NS,'path');
      const d = `M ${b.x1} ${b.y1} L ${b.x2} ${b.y2}`;
      path.setAttribute('d', d);
      path.setAttribute('class','branch');
      path.setAttribute('stroke', getBranchColor(b, i));
      path.setAttribute('stroke-width', b.width);
      path.setAttribute('opacity', 0.6 + Math.max(0, (4-b.depth))*0.08);
      canvas.appendChild(path);

      if(animateSet.has(i)){
        const len = Math.hypot(b.x2-b.x1, b.y2-b.y1) || 1;
        path.style.strokeDasharray = len;
        path.style.strokeDashoffset = len;
        requestAnimationFrame(()=>{
          path.style.transition = 'stroke-dashoffset 0.5s ease-out';
          path.style.strokeDashoffset = 0;
        });
      }
    });
  }

  function growBranches(moduleId, qty){
    const startLen = branches.length;
    for(let i=0;i<qty;i++) addBranch(moduleId);
    resizeCanvas();
    // animate at most the last 6 new branches to keep bulk buys snappy
    const animCount = Math.min(qty, 6);
    const animIndices = [];
    for(let i=branches.length-animCount; i<branches.length; i++) animIndices.push(i);
    render(animIndices);
  }

  // ---------- economy ----------
  function costFor(def, ownedCount){
    return Math.ceil(def.baseCost * Math.pow(def.costMult, ownedCount));
  }
  // cost to buy `qty` starting from current owned count (geometric series)
  function bulkCostFor(def, ownedCount, qty){
    const m = def.costMult;
    const first = def.baseCost * Math.pow(m, ownedCount);
    const total = Math.abs(m-1) < 1e-9 ? first*qty : first*(Math.pow(m,qty)-1)/(m-1);
    return Math.ceil(total);
  }
  function totalEchoCount(){
    let s = 0;
    MODULE_DEFS.forEach(d => s += (state.echoes[d.id] || 0));
    return s;
  }
  function globalEchoMultiplier(){
    return 1 + totalEchoCount()*0.01;
  }
  // Prestige-shop passive bonus: +1% to total rate per level, bought
  // directly with eternal seeds. Survives Prestige resets like Echo does,
  // but doesn't require owning/upgrading any specific module — a simpler,
  // more direct lever for players sitting on a stockpile of seeds.
  function prestigeRateMultiplier(){
    return 1 + (state.prestige.passiveRateLevel||0)*0.01;
  }
  function echoCost(def){
    const n = state.echoes[def.id] || 0;
    const cost = ECHO_BASE_SECONDS * totalRate() * Math.pow(ECHO_COST_MULT, n);
    return Math.ceil(Math.max(cost, 1));
  }
  function effectiveRate(def){
    return def.rate * rootUpgradeMultiplier(def.id) * globalEchoMultiplier() * prestigeRateMultiplier();
  }
  function totalRate(){
    let r = BASE_RATE * globalEchoMultiplier() * prestigeRateMultiplier();
    MODULE_DEFS.forEach(m => r += state.owned[m.id]*effectiveRate(m));
    return r * currentBuffMultiplier();
  }

  // ---------- random events ----------
  // Ephemeral (not saved) — short-lived rewards spawned as a clickable icon
  // somewhere over the root visualization. Either an instant nutrient bump,
  // a temporary rate multiplier, or a rare "lucky" jackpot buff.
  // Regular and Lucky buffs live in separate slots so they can be active
  // simultaneously and stack additively (each contributes its own bonus on
  // top of the baseline) rather than one overwriting the other. Within the
  // same category, a new buff still simply replaces the old one.
  let activeBuff = null;      // regular buff: { multiplier, expiresAt }
  let activeLuckyBuff = null; // lucky buff: { multiplier, expiresAt }
  let currentEventEl = null;

  function regularBuffMultiplier(){
    if(activeBuff && Date.now() < activeBuff.expiresAt) return activeBuff.multiplier;
    if(activeBuff) activeBuff = null;
    return 1;
  }
  function luckyBuffMultiplier(){
    if(activeLuckyBuff && Date.now() < activeLuckyBuff.expiresAt) return activeLuckyBuff.multiplier;
    if(activeLuckyBuff) activeLuckyBuff = null;
    return 1;
  }
  function currentBuffMultiplier(){
    // additive: base(1) + each active buff's own bonus-above-1, so neither
    // buff cancels or multiplies the other — e.g. base 10, ×2 regular alone
    // gives 20, ×777 lucky alone gives 7770, both together give
    // 10*(2 + 777 - 1) = 7780, not 10*2*777.
    return 1 + (regularBuffMultiplier()-1) + (luckyBuffMultiplier()-1);
  }

  function showFloatingText(x, y, text, color){
    const el = document.createElement('div');
    el.className = 'floating-text';
    el.textContent = text;
    el.style.left = x+'px';
    el.style.top = y+'px';
    el.style.color = color;
    stageBox.appendChild(el);
    setTimeout(() => el.remove(), 1600);
  }

  function spawnEvent(){
    if(currentEventEl) return;
    if(!stageBox.clientWidth) { scheduleNextEvent(); return; } // not visible/laid out yet

    const r = Math.random();
    // lucky's chance is upgradeable (0.7%-7%); whatever % it takes comes
    // proportionally out of buff/bump, keeping their original 32:60 ratio
    // to each other so everything still sums to 100%
    const luckyPct = luckyChancePct();
    const nonLuckyPct = 1 - luckyPct;
    const buffPct = nonLuckyPct * (32/92);
    let type = r < luckyPct ? 'lucky' : (r < luckyPct+buffPct ? 'buff' : 'bump');

    const sideMargin = 20;
    const topMargin = 52; // clear the sticky top bar (stage label / buff badge)
    const bottomMargin = 20;
    const iconSize = 52;
    const w = Math.max(stageBox.clientWidth - sideMargin*2 - iconSize, 10);
    const h = Math.max(stageBox.clientHeight - topMargin - bottomMargin - iconSize, 10);
    const left = sideMargin + Math.random()*w;
    const top = stageBox.scrollTop + topMargin + Math.random()*h;

    const el = document.createElement('button');
    el.className = 'game-event' + (type==='lucky' ? ' lucky' : '');
    el.style.left = left+'px';
    el.style.top = top+'px';
    el.textContent = type==='lucky' ? '🍀' : (type==='buff' ? '⚡' : '🎁');
    stageBox.appendChild(el);
    currentEventEl = el;

    if(state.prestige.autoEvent){
      setTimeout(() => { if(el.isConnected) el.click(); }, 800 + Math.random()*2500);
    }

    const expireTimer = setTimeout(() => {
      el.classList.add('fading');
      setTimeout(() => el.remove(), 400);
      currentEventEl = null;
      scheduleNextEvent();
    }, 12000);

    el.addEventListener('click', () => {
      clearTimeout(expireTimer);
      const cx = left + 26, cy = top + 20;
      const bonusMult = eventBonusMult();
      const durationMult = eventDurationMult();
      if(type === 'bump'){
        const seconds = (30 + Math.random()*60) * durationMult;
        const amount = totalRate()*seconds*bonusMult;
        state.nutrients += amount;
        state.runEarned += amount;
        showFloatingText(cx, cy, '+'+fmt(amount), 'var(--accent-amber)');
      } else if(type === 'lucky'){
        const mult = (1 + (777-1)*bonusMult) * luckyMagnitudeExtra();
        const seconds = 7 * luckyDurationExtra();
        activeLuckyBuff = { multiplier: mult, expiresAt: Date.now()+seconds*1000 };
        showFloatingText(cx, cy, `🍀 โชคดี! ×${fmtInt(mult)}`, '#ffd76a');
      } else {
        const baseMult = 2 + Math.random()*2;
        const mult = 1 + (baseMult-1)*bonusMult;
        const seconds = (20 + Math.random()*40) * durationMult;
        activeBuff = { multiplier: mult, expiresAt: Date.now()+seconds*1000 };
        showFloatingText(cx, cy, `×${mult.toFixed(1)} เรท!`, 'var(--accent-glow)');
      }
      el.remove();
      currentEventEl = null;
      updateStats();
      updateShopAfford();
      scheduleNextEvent();
    });
  }

  function scheduleNextEvent(){
    // min/max chosen so that even a fully-maxed Lucky duration (42s) still
    // leaves >=60s of gap before the fastest possible next spawn (105s):
    // 105 - 42 = 63s >= 60s target, preventing buffs from chaining into
    // each other via a same-category "reset" overlap.
    const delay = 105000 + Math.random()*50000; // 105–155s
    setTimeout(spawnEvent, delay);
  }

  // If the viewport is resized/rotated while an event is showing, its
  // pixel position could end up outside the (now differently-sized) stage —
  // just discard it and let a fresh one spawn later, rather than risk it
  // being stuck off-screen and unclickable.
  let resizeDiscardTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeDiscardTimer);
    resizeDiscardTimer = setTimeout(() => {
      if(currentEventEl){
        currentEventEl.remove();
        currentEventEl = null;
        scheduleNextEvent();
      }
    }, 200);
  });


  function prestigeUnlocked(){
    return totalEchoCount() >= PRESTIGE_UNLOCK_ECHOES || (state.owned['throne']||0) >= 1;
  }
  function calcPrestigeSeeds(){
    const base = Math.floor(Math.cbrt(state.runEarned / SEED_DIVIDER));
    const bonus = 1 + state.prestige.goldenLevel*0.05;
    return Math.max(0, Math.floor(base*bonus));
  }
  // Repeatable items scale multiplicatively (not linearly) so a single big
  // haul of eternal seeds can't max them out — real long-term meta progression
  // across many prestige cycles, not a one-time shopping spree.
  function starterCultureCost(){ return Math.ceil(15 * Math.pow(1.5, state.prestige.starterLevel)); }
  function goldenSeedCost(){ return Math.ceil(20 * Math.pow(1.6, state.prestige.goldenLevel)); }
  function offlineCapMaxed(){ return state.prestige.offlineCapLevel >= OFFLINE_CAP_HOURS.length-1; }
  function offlineCapCost(){ return state.prestige.offlineCapLevel===0 ? 80 : 220; }
  function eventBonusCost(){ return Math.ceil(25 * Math.pow(1.55, state.prestige.eventBonusLevel)); }
  function eventDurationCost(){ return Math.ceil(20 * Math.pow(1.5, state.prestige.eventDurationLevel)); }
  function eventBonusMult(){ return 1 + (state.prestige.eventBonusLevel||0)*0.2; } // magnitude: intentionally uncapped
  // Capped at level 4: regular buff's base duration maxes out at 60s, so
  // 60 * durationMult must stay under the 105s minimum spawn gap or the
  // buff could still be running when the next event arrives.
  const EVENT_DURATION_MAX_LEVEL = 4;
  function eventDurationMaxed(){ return (state.prestige.eventDurationLevel||0) >= EVENT_DURATION_MAX_LEVEL; }
  function eventDurationMult(){ return 1 + (state.prestige.eventDurationLevel||0)*0.15; }
  // Lucky-only upgrades: linear cost (3000, 6000, 9000...) rather than
  // multiplicative — on a ×777 base, exponential growth would hit the
  // hundred-thousands/millions almost immediately, which isn't the intent.
  function luckyMagnitudeCost(){ return 3000 * (state.prestige.luckyMagnitudeLevel + 1); }
  function luckyDurationCost(){ return 3000 * (state.prestige.luckyDurationLevel + 1); }
  function luckyMagnitudeExtra(){ return 1 + state.prestige.luckyMagnitudeLevel; }
  // Capped at level 5 (42s max) and deliberately NOT scaled by the shared
  // "ขยายเวลาบัฟ" upgrade — kept fully self-contained so the spawn-interval
  // math below (guaranteeing a gap after the buff ends) stays valid.
  const LUCKY_DURATION_MAX_LEVEL = 5;
  function luckyDurationMaxed(){ return state.prestige.luckyDurationLevel >= LUCKY_DURATION_MAX_LEVEL; }
  function luckyDurationExtra(){ return 1 + state.prestige.luckyDurationLevel; }

  // Lucky Chance: base 0.7%, +0.7 percentage points per level, caps at 7%
  // over exactly 9 levels. The extra % is taken proportionally FROM the
  // buff/bump pool (not added on top), so the three probabilities always
  // still sum to 100%.
  const LUCKY_CHANCE_BASE = 0.007;
  const LUCKY_CHANCE_STEP = 0.007;
  const LUCKY_CHANCE_MAX_LEVEL = 9; // 0.007 + 9*0.007 = 0.07 exactly
  const LUCKY_CHANCE_MAX = 0.07;
  function luckyChanceMaxed(){ return state.prestige.luckyChanceLevel >= LUCKY_CHANCE_MAX_LEVEL; }
  function luckyChancePct(){
    return Math.min(LUCKY_CHANCE_MAX, LUCKY_CHANCE_BASE + state.prestige.luckyChanceLevel*LUCKY_CHANCE_STEP);
  }
  function luckyChanceCost(){ return 500 * (state.prestige.luckyChanceLevel + 1); }

  const PASSIVE_RATE_COST = 100; // flat cost per level, unlimited levels

  const AUTO_ROOT_COST = 50;
  const AUTO_ROOT_SMART_COST = 180;
  const AUTO_ROOT_ALL_COST = 500;
  const AURA_ROOTS_COST = 100;
  const SKIN_COST = 100; // same price for each of the 3 new skins, bought separately
  const AUTO_RESET_COST = 10000; // ultimate comfort item — auto-Prestiges once it's worthwhile
  const AUTO_RESET_MIN_SEEDS = 3; // avoid resetting for a trivial 1-seed gain
  const AUTO_EVENT_COST = 1000; // priciest one-time item — fully automates capturing event value, no more missed events ever
  function currentOfflineCapSeconds(){
    return OFFLINE_CAP_HOURS[state.prestige.offlineCapLevel] * 3600;
  }

  function fmt(n){
    if(n < 1000) return n.toFixed(n<10?2:1);
    const units = ['K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
    let u = -1;
    while(n >= 1000 && u < units.length-1){ n/=1000; u++; }
    return n.toFixed(2)+units[u];
  }
  // for small whole-number values like eternal seeds and their costs —
  // avoids showing "3.00" when "3" reads much more naturally
  function fmtInt(n){
    return n < 1000 ? String(Math.round(n)) : fmt(n);
  }

  function stageName(){
    const t = state.totalOwned;
    if(t < 5) return 'ระยะเมล็ด';
    if(t < 15) return 'รากงอกแรก';
    if(t < 35) return 'เครือข่ายราก';
    if(t < 70) return 'รากแผ่กว้าง';
    if(t < 150) return 'ป่าใต้ดิน';
    if(t < 400) return 'เขาวงกตราก';
    return 'อาณาจักรใต้พิภพ';
  }

  const BUY_QTY_OPTIONS = [1, 5, 10, 50, 100];

  function buy(defId){
    const idx = MODULE_DEFS.findIndex(m=>m.id===defId);
    if(!moduleUnlocked(idx)) return;
    const def = MODULE_DEFS.find(m=>m.id===defId);
    const qty = state.buyQty;
    const cost = bulkCostFor(def, state.owned[defId], qty);
    if(state.nutrients < cost) return;
    state.nutrients -= cost;
    state.owned[defId] += qty;
    state.totalOwned += qty;
    growBranches(defId, qty);
    refreshModuleTexts(defId);
    refreshModuleLocks();
    refreshRootUpgrades();
    refreshEchoes();
    scheduleSave();
  }

  // "ออโต้ราก" prestige perk: buys one thing per tick (every 2s):
  //  - base tier: cheapest affordable module
  //  - +smart: best value (rate gained per nutrient spent) among modules
  //  - +all: also considers upgrades, fertilizer, and echo as candidates,
  //    each valued by their own approximate rate gain per nutrient spent,
  //    and buys whichever single option — of any category — is best.
  function autoBuyOne(){
    if(!state.prestige.autoRoot) return;
    const smart = state.prestige.autoRootSmart;
    const all = state.prestige.autoRootAll;

    let bestApply = null, bestCost = Infinity, bestValue = -Infinity;
    function consider(cost, value, apply){
      if(state.nutrients < cost) return;
      if(smart){
        if(value > bestValue){ bestValue = value; bestCost = cost; bestApply = apply; }
      } else {
        if(cost < bestCost){ bestCost = cost; bestApply = apply; }
      }
    }

    MODULE_DEFS.forEach((def, i) => {
      if(!moduleUnlocked(i)) return;
      const cost = costFor(def, state.owned[def.id]);
      // Rank by the absolute rate this purchase adds, not rate/cost ratio.
      // Since everyone being compared shares the same current totalRate(),
      // "biggest absolute gain" and "biggest % impact on total production"
      // are the same ordering — this is what naturally favors a barely-touched
      // late tier over squeezing more out of an already heavily-upgraded
      // early one, without needing an artificial tier bias.
      const value = effectiveRate(def);
      consider(cost, value, () => {
        state.owned[def.id] += 1;
        state.totalOwned += 1;
        growBranches(def.id, 1);
        refreshModuleTexts(def.id);
        refreshModuleLocks();
        refreshRootUpgrades();
        refreshEchoes();
      });
    });

    if(all){
      MODULE_DEFS.forEach(def => {
        const level = (state.rootUpgrades[def.id] || 0) + 1;
        if(state.owned[def.id] < rootUpgradeRequireOwned(level)) return;
        const cost = rootUpgradeCost(def, level);
        const gain = state.owned[def.id] * effectiveRate(def) * (rootUpgradeLevelMult(level)-1);
        consider(cost, gain, () => {
          state.rootUpgrades[def.id] = level;
          refreshRootUpgrades();
          refreshModuleTexts(def.id);
        });
      });
      MODULE_DEFS.forEach(def => {
        if(!echoUnlockedFor(def.id)) return;
        const cost = echoCost(def);
        const gain = totalRate() * 0.01; // approx marginal value of +1% global rate
        consider(cost, gain, () => {
          state.echoes[def.id] = (state.echoes[def.id] || 0) + 1;
          refreshEchoes();
          MODULE_DEFS.forEach(d => refreshModuleTexts(d.id));
        });
      });
    }

    if(!bestApply) return;
    state.nutrients -= bestCost;
    bestApply();
    scheduleSave();
  }

  function buyRootUpgrade(moduleId){
    const def = MODULE_DEFS.find(m=>m.id===moduleId);
    if(!def) return;
    const level = (state.rootUpgrades[moduleId] || 0) + 1;
    if(state.owned[moduleId] < rootUpgradeRequireOwned(level)) return;
    const cost = rootUpgradeCost(def, level);
    if(state.nutrients < cost) return;
    state.nutrients -= cost;
    state.rootUpgrades[moduleId] = level;
    refreshRootUpgrades();
    refreshModuleTexts(moduleId);
    refreshEchoes();
    scheduleSave();
  }

  function buyEcho(moduleId){
    const def = MODULE_DEFS.find(m=>m.id===moduleId);
    if(!def || !echoUnlockedFor(moduleId)) return;
    const cost = echoCost(def);
    if(state.nutrients < cost) return;
    state.nutrients -= cost;
    state.echoes[moduleId] = (state.echoes[moduleId] || 0) + 1;
    refreshEchoes();
    // the global multiplier changed, so every module's displayed total needs updating
    MODULE_DEFS.forEach(d => refreshModuleTexts(d.id));
    scheduleSave();
  }

  const moduleRefs = {}; // id -> {el, ownedSpan, costSpan, totalSpan}
  const rootUpgradeRefs = {}; // id -> {el, ...} persistent, like echoRefs (never disappears once unlocked)
  const echoRefs = {}; // id -> {el, ownedSpan, costSpan} (persists across purchases, unlike upgrade/fertilizer)
  let qtyBar, rootUpgradeTitle, rootUpgradeList, echoTitle, echoList, moduleLockHint;

  function buildShopOnce(){
    shopList.innerHTML = '';
    for(const k in moduleRefs) delete moduleRefs[k];
    for(const k in rootUpgradeRefs) delete rootUpgradeRefs[k];
    for(const k in echoRefs) delete echoRefs[k];

    // quantity selector
    qtyBar = document.createElement('div');
    qtyBar.className = 'qty-bar';
    BUY_QTY_OPTIONS.forEach(q => {
      const btn = document.createElement('button');
      btn.className = 'qty-btn' + (q===state.buyQty ? ' active' : '');
      btn.textContent = 'x'+q;
      btn.addEventListener('click', () => {
        state.buyQty = q;
        qtyBar.querySelectorAll('.qty-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        MODULE_DEFS.forEach(def => refreshModuleTexts(def.id));
      });
      qtyBar.appendChild(btn);
    });
    shopList.appendChild(qtyBar);

    MODULE_DEFS.forEach(def => {
      const el = document.createElement('div');
      el.className = 'module has-hovercard';
      el.style.borderLeft = `3px solid ${def.color}`;
      el.innerHTML = `
        <div class="module-body">
          <div class="module-top">
            <span class="module-name">${def.name}</span>
            <span class="module-owned">×0</span>
          </div>
          <div class="module-desc">${def.desc}</div>
          <div class="module-bottom">
            <span class="module-cost">0</span>
            <span class="module-rate">+0/วิ</span>
          </div>
        </div>
        <div class="module-hovercard">
          <div class="mh-row"><span>เรทเริ่มต้น</span><b class="mh-base">+${fmt(def.rate)}/วิ</b></div>
          <div class="mh-row"><span>อัพเกรดราก</span><b class="mh-ru">Lv.0 ×1.00</b></div>
          <div class="mh-row"><span>โบนัสสะท้อนราก</span><b class="mh-echo">×1.000</b></div>
          <div class="mh-divider"></div>
          <div class="mh-row mh-highlight"><span>เรทต่อชิ้นจริง</span><b class="mh-eff">+${fmt(def.rate)}/วิ</b></div>
          <div class="mh-row"><span>สัดส่วนจากทั้งหมด</span><b class="mh-share">0%</b></div>
        </div>`;
      el.addEventListener('click', () => buy(def.id));
      el.addEventListener('mouseenter', () => {
        const card = el.querySelector('.module-hovercard');
        const spaceBelow = window.innerHeight - el.getBoundingClientRect().bottom;
        card.classList.toggle('above', spaceBelow < 170);
      });
      shopList.appendChild(el);
      moduleRefs[def.id] = {
        el,
        ownedSpan: el.querySelector('.module-owned'),
        costSpan: el.querySelector('.module-cost'),
        totalSpan: el.querySelector('.module-rate'),
        hoverBase: el.querySelector('.mh-base'),
        hoverRU: el.querySelector('.mh-ru'),
        hoverEcho: el.querySelector('.mh-echo'),
        hoverEff: el.querySelector('.mh-eff'),
        hoverShare: el.querySelector('.mh-share')
      };
      refreshModuleTexts(def.id);
    });

    moduleLockHint = document.createElement('div');
    moduleLockHint.className = 'upgrade-hint';
    shopList.appendChild(moduleLockHint);
    refreshModuleLocks();

    rootUpgradeTitle = document.createElement('div');
    rootUpgradeTitle.className = 'panel-title';
    rootUpgradeTitle.textContent = 'อัพเกรดราก';
    rootUpgradeTitle.style.marginTop = '10px';
    shopList.appendChild(rootUpgradeTitle);

    rootUpgradeList = document.createElement('div');
    shopList.appendChild(rootUpgradeList);

    refreshRootUpgrades();

    echoTitle = document.createElement('div');
    echoTitle.className = 'panel-title';
    echoTitle.textContent = 'สะท้อนราก';
    echoTitle.style.marginTop = '10px';
    shopList.appendChild(echoTitle);

    echoList = document.createElement('div');
    shopList.appendChild(echoList);

    refreshEchoes();
  }

  function refreshModuleTexts(defId){
    const def = MODULE_DEFS.find(m=>m.id===defId);
    const ref = moduleRefs[defId];
    const owned = state.owned[defId];
    const qty = state.buyQty;
    ref.ownedSpan.textContent = '×' + owned;
    ref.costSpan.textContent = fmt(bulkCostFor(def, owned, qty)) + (qty>1 ? ` (x${qty})` : '');
    updateModuleStats(defId);
  }

  // Three numbers only, as requested: base per-unit rate, total output from
  // this type (already includes Root Upgrade + Echo), and its share of your
  // overall total rate. The tooltip breaks down exactly where the boosted
  // number comes from for anyone who wants the detail.
  function updateModuleStats(defId){
    const def = MODULE_DEFS.find(m=>m.id===defId);
    const ref = moduleRefs[defId];
    if(!ref || !ref.totalSpan) return;
    const owned = state.owned[defId];
    const eff = effectiveRate(def);
    const total = owned * eff;
    const current = totalRate();
    const share = current > 0 ? (total/current)*100 : 0;
    const shareText = share < 0.1 ? '<0.1%' : (share < 10 ? share.toFixed(1)+'%' : Math.round(share)+'%');

    ref.totalSpan.textContent = '+' + fmt(total) + '/วิ';

    const ruLevel = state.rootUpgrades[defId] || 0;
    const ruMult = rootUpgradeMultiplier(defId);
    const echoMult = globalEchoMultiplier();
    ref.hoverBase.textContent = '+' + fmt(def.rate) + '/วิ';
    ref.hoverRU.textContent = `Lv.${ruLevel} ×${ruMult.toFixed(2)}`;
    ref.hoverEcho.textContent = `×${echoMult.toFixed(3)}`;
    ref.hoverEff.textContent = '+' + fmt(eff) + '/วิ';
    ref.hoverShare.textContent = shareText;
  }

  // Modules unlock one at a time: you need at least 1 of tier N-1 before
  // tier N's card appears at all.
  function moduleUnlocked(index){
    return index === 0 || state.owned[MODULE_DEFS[index-1].id] >= 1;
  }

  // One-time migration for saves created before the sequential-unlock
  // feature: if you already own a higher tier while some tier below it was
  // never bought (perfectly normal in the old free-for-all shop), grant 1
  // free unit of each skipped tier so the chain isn't broken and nothing
  // ends up stuck behind an unreachable gap. Runs once, ever.
  function backfillUnlockGaps(){
    if(state.lockGapBackfilled) return 0;
    let maxOwnedIndex = -1;
    MODULE_DEFS.forEach((d, i) => { if(state.owned[d.id] > 0) maxOwnedIndex = i; });
    let granted = 0;
    for(let i=0; i<maxOwnedIndex; i++){
      const id = MODULE_DEFS[i].id;
      if(!(state.owned[id] > 0)){
        state.owned[id] = 1;
        state.totalOwned += 1;
        granted++;
      }
    }
    state.lockGapBackfilled = true;
    return granted;
  }

  function refreshModuleLocks(){
    let firstLockedIndex = -1;
    MODULE_DEFS.forEach((def, i) => {
      const unlocked = moduleUnlocked(i);
      const ref = moduleRefs[def.id];
      if(ref) ref.el.style.display = unlocked ? '' : 'none';
      if(!unlocked && firstLockedIndex === -1) firstLockedIndex = i;
    });
    if(!moduleLockHint) return;
    if(firstLockedIndex === -1){
      moduleLockHint.style.display = 'none';
    } else {
      moduleLockHint.style.display = '';
      moduleLockHint.textContent =
        `🔒 มีรากเสริมอีก ${MODULE_DEFS.length - firstLockedIndex} ชนิดรออยู่ — ซื้อ ${MODULE_DEFS[firstLockedIndex-1].name} อย่างน้อย 1 ต้น เพื่อปลดล็อก ${MODULE_DEFS[firstLockedIndex].name}`;
    }
  }

  // rebuilds only the upgrade cards (list changes as owned-thresholds are crossed)
  // Root Upgrade cards persist and keep growing (like Echo's pattern) —
  // once a module crosses the level-1 threshold, its card appears and stays
  // forever, always showing the NEXT level's cost/effect.
  function refreshRootUpgrades(){
    if(!rootUpgradeList) return;
    const unlockedIds = MODULE_DEFS.filter(d => state.owned[d.id] >= rootUpgradeRequireOwned(1)).map(d=>d.id);

    if(unlockedIds.length === 0){
      rootUpgradeList.innerHTML = '';
      for(const key in rootUpgradeRefs) delete rootUpgradeRefs[key];
      const hint = document.createElement('div');
      hint.className = 'upgrade-hint';
      hint.textContent = `ซื้อรากเสริมให้ถึง ${rootUpgradeRequireOwned(1)} ต้น เพื่อปลดล็อกอัพเกรดราก — ระดับปกติ +30%, ทุกระดับที่ 5 เป็น ×2`;
      rootUpgradeList.appendChild(hint);
      rootUpgradeTitle.style.display = 'none';
      return;
    }
    rootUpgradeTitle.style.display = '';

    unlockedIds.forEach(id => {
      const def = MODULE_DEFS.find(m=>m.id===id);
      if(!rootUpgradeRefs[id]){
        const el = document.createElement('div');
        el.className = 'module rootupgrade';
        el.style.borderLeft = `3px solid ${def.color}`;
        el.innerHTML = `
          <div class="module-top">
            <span class="module-name">⬆️ อัพเกรดราก: ${def.name}</span>
            <span class="module-owned">Lv.0</span>
          </div>
          <div class="module-desc"></div>
          <div class="module-bottom">
            <span class="module-cost">0</span>
            <span class="module-rate"></span>
          </div>`;
        el.addEventListener('click', () => buyRootUpgrade(id));
        rootUpgradeList.appendChild(el);
        rootUpgradeRefs[id] = {
          el,
          levelSpan: el.querySelector('.module-owned'),
          descSpan: el.querySelector('.module-desc'),
          costSpan: el.querySelector('.module-cost'),
          effectSpan: el.querySelector('.module-rate')
        };
      }
      updateRootUpgradeCardText(id);
    });
  }

  function updateRootUpgradeCardText(id){
    const ref = rootUpgradeRefs[id];
    if(!ref) return;
    const def = MODULE_DEFS.find(m=>m.id===id);
    const level = state.rootUpgrades[id] || 0;
    const nextLevel = level + 1;
    const milestone = rootUpgradeIsMilestone(nextLevel);
    const cost = rootUpgradeCost(def, nextLevel);
    const req = rootUpgradeRequireOwned(nextLevel);
    ref.el.classList.toggle('milestone', milestone);
    ref.levelSpan.textContent = 'Lv.' + level;
    ref.costSpan.textContent = fmt(cost);
    ref.effectSpan.textContent = milestone ? '×2 ✨' : '+30%';
    ref.descSpan.textContent = milestone
      ? `ระดับถัดไปเป็นระดับพิเศษ: เพิ่มอัตราของ${def.name}เป็น 2 เท่า (ต้องมีอย่างน้อย ${req} ต้น)`
      : `ระดับถัดไป: เพิ่มอัตราของ${def.name}อีก 30% (ต้องมีอย่างน้อย ${req} ต้น)`;
  }

  // Root Echo cards persist and keep growing (unlike upgrade/fertilizer,
  // which disappear once bought) — only rebuilt when newly unlocked.
  function refreshEchoes(){
    if(!echoList) return;
    const unlockedIds = MODULE_DEFS.filter(d => echoUnlockedFor(d.id)).map(d=>d.id);

    if(unlockedIds.length === 0){
      echoList.innerHTML = '';
      for(const k in echoRefs) delete echoRefs[k];
      const hint = document.createElement('div');
      hint.className = 'upgrade-hint';
      hint.textContent = `ปลดล็อกเมื่อมีรากชนิดใดชนิดหนึ่งครบ ${ECHO_REQUIRE_OWNED} ต้น และซื้ออัพเกรด "เร่งการเติบโต" ครบทั้ง I และ II ของชนิดนั้น — เพิ่มเรทรวมทั้งฟาร์ม ไม่ใช่แค่ชนิดนั้น`;
      echoList.appendChild(hint);
      echoTitle.style.display = 'none';
      return;
    }
    echoTitle.style.display = '';

    unlockedIds.forEach(id => {
      const def = MODULE_DEFS.find(m=>m.id===id);
      if(!echoRefs[id]){
        const el = document.createElement('div');
        el.className = 'module echo';
        el.style.borderLeft = `3px solid ${def.color}`;
        el.innerHTML = `
          <div class="module-top">
            <span class="module-name">🔁 สะท้อนราก: ${def.name}</span>
            <span class="module-owned">×0</span>
          </div>
          <div class="module-desc">เพิ่มเรทรวมทั้งฟาร์ม (ทุกชนิด) อีก 1% แบบถาวรต่อครั้ง</div>
          <div class="module-bottom">
            <span class="module-cost">0</span>
            <span class="module-rate">+1% รวม</span>
          </div>`;
        el.addEventListener('click', () => buyEcho(id));
        echoList.appendChild(el);
        echoRefs[id] = {
          el,
          ownedSpan: el.querySelector('.module-owned'),
          costSpan: el.querySelector('.module-cost')
        };
      }
      const ref = echoRefs[id];
      ref.ownedSpan.textContent = '×' + (state.echoes[id] || 0);
      ref.costSpan.textContent = fmt(echoCost(def));
    });
  }

  // called every tick: only toggles affordability styling, never rebuilds DOM
  function updateShopAfford(){
    MODULE_DEFS.forEach(def => {
      const ref = moduleRefs[def.id];
      const cost = bulkCostFor(def, state.owned[def.id], state.buyQty);
      ref.el.classList.toggle('disabled', state.nutrients < cost);
      updateModuleStats(def.id);
    });
    for(const id in rootUpgradeRefs){
      const def = MODULE_DEFS.find(m=>m.id===id);
      const level = state.rootUpgrades[id] || 0;
      const nextLevel = level + 1;
      const cost = rootUpgradeCost(def, nextLevel);
      const req = rootUpgradeRequireOwned(nextLevel);
      updateRootUpgradeCardText(id);
      rootUpgradeRefs[id].el.classList.toggle('disabled', state.nutrients < cost || state.owned[id] < req);
    }
    for(const id in echoRefs){
      const def = MODULE_DEFS.find(m=>m.id===id);
      echoRefs[id].el.classList.toggle('disabled', state.nutrients < echoCost(def));
    }
  }

  function updateStats(){
    nutrientDisplay.textContent = fmt(state.nutrients);
    rateDisplay.textContent = `+${fmt(totalRate())} สารอาหาร/วิ`;
    stageLabel.textContent = stageName();
    if(state.eternalSeeds > 0){
      seedsDisplay.style.display = '';
      seedsDisplay.textContent = `🌌 เมล็ดนิรันดร์: ${fmtInt(state.eternalSeeds)}`;
    }
    const buffParts = [];
    if(activeBuff && Date.now() < activeBuff.expiresAt){
      const remain = Math.ceil((activeBuff.expiresAt - Date.now())/1000);
      buffParts.push(`⚡ ×${activeBuff.multiplier.toFixed(2)} ${remain}วิ`);
    }
    if(activeLuckyBuff && Date.now() < activeLuckyBuff.expiresAt){
      const remain = Math.ceil((activeLuckyBuff.expiresAt - Date.now())/1000);
      buffParts.push(`🍀 ×${fmtInt(activeLuckyBuff.multiplier)} ${remain}วิ`);
    }
    if(buffParts.length){
      buffDisplay.style.display = '';
      buffDisplay.textContent = buffParts.join(' · ');
    } else {
      buffDisplay.style.display = 'none';
    }
    playTimeDisplay.textContent = `⏱️ เล่นทั้งหมด ${formatDuration(state.totalPlayTimeSeconds)} · รอบนี้ ${formatDuration(state.runPlayTimeSeconds)}`;
    refreshPrestigeBar();
    if(prestigeModalOpen) refreshPrestigePreview();

  let prestigeModalOpen = false;

  function refreshPrestigeBar(){
    const canReset = prestigeUnlocked() && calcPrestigeSeeds() > 0;
    const hasShopAccess = state.eternalSeeds > 0;
    prestigeBtn.style.display = (canReset || hasShopAccess) ? 'inline-flex' : 'none';
  }

  function doPrestigeReset(){
    const gained = calcPrestigeSeeds();
    state.eternalSeeds += gained;
    state.nutrients = 0;
    state.runEarned = 0;
    state.runPlayTimeSeconds = 0;
    MODULE_DEFS.forEach(d => state.owned[d.id] = 0);
    state.totalOwned = 0;
    state.rootUpgrades = {};
    state.buyQty = 1;
    // echoes and prestige-shop purchases intentionally survive the reset

    const starterBonus = state.prestige.starterLevel * 10;
    if(starterBonus > 0){
      state.owned['fine'] = starterBonus;
      state.totalOwned += starterBonus;
    }

    rebuildBranches(deriveLog(state.owned), false);
    buildShopOnce();
    updateShopAfford();
    updateStats();
    refreshAuraToggle();
    scheduleSave();
    return gained;
  }

  // True hard reset: wipes absolutely everything, including eternal seeds
  // and every Prestige-shop purchase (unlike a normal Prestige, which keeps
  // those). Starts the whole game over from zero.
  function doHardReset(){
    state = createFreshState();
    activeBuff = null;
    activeLuckyBuff = null;
    rebuildBranches([], false);
    buildShopOnce();
    updateShopAfford();
    updateStats();
    refreshAuraToggle();
    refreshPrestigeBar();
    scheduleSave();
  }

  function checkAutoReset(){
    if(!state.prestige.autoReset || !state.prestige.autoResetEnabled) return;
    if(!prestigeUnlocked()) return;
    if(calcPrestigeSeeds() < AUTO_RESET_MIN_SEEDS) return;
    const gained = doPrestigeReset();
    if(stageBox.clientWidth){
      showFloatingText(stageBox.clientWidth/2, stageBox.clientHeight/2 || 40,

  // Cycles through every skin the player owns, in a fixed order, wrapping
  // back to 'none' at the end — e.g. own rainbow + grayscale: none -> rainbow
  // -> grayscale -> none -> ...
  const SKIN_CYCLE_ORDER = ['none', 'rainbow', 'sameorigin', 'grayscale', 'gradient'];
  function ownedSkinList(){
    return SKIN_CYCLE_ORDER.filter(id => {
      if(id === 'none') return true;
      if(id === 'rainbow') return state.prestige.auraRoots;
      if(id === 'sameorigin') return state.prestige.skinSameOrigin;
      if(id === 'grayscale') return state.prestige.skinGrayscale;
      if(id === 'gradient') return state.prestige.skinGradient;
      return false;
    });
  }
  function toggleAuraSkin(){
    const owned = ownedSkinList();
    if(owned.length <= 1) return; // nothing owned yet besides 'none'
    const curIdx = owned.indexOf(state.prestige.activeSkin);
    const nextIdx = (curIdx === -1 ? 0 : curIdx + 1) % owned.length;
    state.prestige.activeSkin = owned[nextIdx];
    render([]);
    refreshAuraToggle();
    scheduleSave();
  }
  function refreshAuraToggle(){
    const owned = ownedSkinList();
    if(owned.length <= 1){
      auraToggleBtn.style.display = 'none';

    auraToggleBtn.style.display = 'flex';
    auraToggleBtn.classList.toggle('on', state.prestige.activeSkin !== 'none');
    const skinNames = { none:'ปกติ', rainbow:'รุ้ง/ทอง', sameorigin:'รากเดียวกัน', grayscale:'ขาวดำ', gradient:'ไล่เข้ม-อ่อน' };

  function encodeSave(){
    // v5: unified Root Upgrade track (ru) replaces the old separate
    // upgrade+fertilizer fields. Owned counts still drive tree reconstruction.
    const payload = {
      v:5, n:state.nutrients, o:state.owned, t:state.totalOwned,
      ru:state.rootUpgrades, e:state.echoes, q:state.buyQty,
      re:state.runEarned, es:state.eternalSeeds, p:state.prestige,
      pt:state.totalPlayTimeSeconds, rpt:state.runPlayTimeSeconds
    };
    return btoa(JSON.stringify(payload));
  }

  function decodeSave(code){
    const payload = JSON.parse(atob(code.trim()));
    if(!payload || typeof payload !== 'object') throw new Error('invalid save code');
    // backward compatibility with the old v1 format (owned counts recovered
    // by summing the old run-length-encoded log; order itself isn't needed)
    if(!payload.o && Array.isArray(payload.rle)){
      const owned = {};
      payload.rle.forEach(([idx, count]) => {
        const id = MODULE_DEFS[idx] && MODULE_DEFS[idx].id;
        if(id) owned[id] = (owned[id]||0) + count;
      });
      payload.o = owned;
    }
    if(!payload.o) throw new Error('invalid save code');
    return payload;
  }

  function applyImportedPayload(payload){
    state.nutrients = payload.n || 0;
    state.owned = payload.o || {};
    MODULE_DEFS.forEach(d => { if(!(d.id in state.owned)) state.owned[d.id] = 0; });
    state.totalOwned = payload.t || 0;
    state.rootUpgrades = payload.ru || {};
    state.echoes = payload.e || {};
    state.buyQty = BUY_QTY_OPTIONS.includes(payload.q) ? payload.q : 1;
    state.runEarned = payload.re || 0;
    state.eternalSeeds = payload.es || 0;
    state.prestige = Object.assign({
      starterLevel:0, autoRoot:false, autoRootSmart:false, autoRootAll:false, goldenLevel:0, auraRoots:false, auraRootsEnabled:true, skinSameOrigin:false, skinGrayscale:false, skinGradient:false, activeSkin:'none', autoReset:false, autoResetEnabled:true, offlineCapLevel:0, eventBonusLevel:0, eventDurationLevel:0, autoEvent:false, luckyMagnitudeLevel:0, luckyDurationLevel:0, luckyChanceLevel:0, passiveRateLevel:0
    }, payload.p || {});
    if(state.prestige.activeSkin === 'none' && state.prestige.auraRoots && state.prestige.auraRootsEnabled){
      state.prestige.activeSkin = 'rainbow';
    }
    state.lockGapBackfilled = false; // imported data may have its own gaps, always re-check
    backfillUnlockGaps();
    state.totalPlayTimeSeconds = payload.pt || 0;
    state.runPlayTimeSeconds = payload.rpt || 0;

    rebuildBranches(deriveLog(state.owned), false);
    buildShopOnce();
    updateShopAfford();
    updateStats();
    refreshPrestigeBar();
    refreshAuraToggle();
    scheduleSave();
  }

  // ---------- persistence ----------
  const STORAGE_KEY = 'root-idle-state-v1';
  let saveTimer = null;
  let isSaving = false;
  let pendingResave = false;
  let failCount = 0;

  async function save(){
    if(isSaving){ pendingResave = true; return; }
    isSaving = true;
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify({
        nutrients: state.nutrients,
        owned: state.owned,
        totalOwned: state.totalOwned,
        rootUpgrades: state.rootUpgrades,
        echoes: state.echoes,
        runEarned: state.runEarned,
        eternalSeeds: state.eternalSeeds,
        prestige: state.prestige,
        lockGapBackfilled: state.lockGapBackfilled,
        totalPlayTimeSeconds: state.totalPlayTimeSeconds,
        runPlayTimeSeconds: state.runPlayTimeSeconds,
        buyQty: state.buyQty,
        lastTs: Date.now()
      }), false);
      failCount = 0;
    }catch(e){
      failCount++;
      if(failCount === 1){
        console.warn('บันทึกไม่สำเร็จชั่วคราว จะลองใหม่เรื่อยๆ เบื้องหลัง (ไม่กระทบการเล่น)');
      }
    } finally {
      isSaving = false;
      if(pendingResave){ pendingResave = false; scheduleSave(); }
    }
  }
  function scheduleSave(){
    if(saveTimer) return;
    // back off further each consecutive failure, capped at 60s, so a broken
    // backend doesn't turn into a rapid retry loop
    const delay = Math.min(4000 * Math.pow(2, failCount), 60000);
    saveTimer = setTimeout(()=>{ saveTimer=null; save(); }, delay);
  }

  function formatDuration(sec){
    sec = Math.round(sec);
    if(sec < 60) return sec + ' วินาที';
    const m = Math.floor(sec/60);
    if(m < 60) return m + ' นาที';
    const h = Math.floor(m/60);
    const rm = m % 60;
    if(h < 24) return h + ' ชม ' + rm + ' นาที';
    const d = Math.floor(h/24);
    const rh = h % 24;
    return d + ' วัน ' + rh + ' ชม';
  }

      state.runEarned += gain;
      offlineBackdrop.style.display = 'none';
      updateStats();
      updateShopAfford();
      scheduleSave();
    };
  }

  async function load(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      if(res && res.value){
        const data = JSON.parse(res.value);
        state.nutrients = data.nutrients || 0;
        state.owned = data.owned || state.owned;
        MODULE_DEFS.forEach(d => { if(!(d.id in state.owned)) state.owned[d.id] = 0; });
        state.totalOwned = data.totalOwned || 0;
        state.rootUpgrades = data.rootUpgrades || {};
        state.echoes = data.echoes || {};
        state.buyQty = BUY_QTY_OPTIONS.includes(data.buyQty) ? data.buyQty : 1;
        state.runEarned = data.runEarned || 0;
        state.eternalSeeds = data.eternalSeeds || 0;
        state.prestige = Object.assign({
          starterLevel:0, autoRoot:false, autoRootSmart:false, autoRootAll:false, goldenLevel:0, auraRoots:false, auraRootsEnabled:true, skinSameOrigin:false, skinGrayscale:false, skinGradient:false, activeSkin:'none', autoReset:false, autoResetEnabled:true, offlineCapLevel:0, eventBonusLevel:0, eventDurationLevel:0, autoEvent:false, luckyMagnitudeLevel:0, luckyDurationLevel:0, luckyChanceLevel:0, passiveRateLevel:0
        }, data.prestige || {});
        if(state.prestige.activeSkin === 'none' && state.prestige.auraRoots && state.prestige.auraRootsEnabled){
          state.prestige.activeSkin = 'rainbow';
        }
        state.lockGapBackfilled = data.lockGapBackfilled || false;
        state.totalPlayTimeSeconds = data.totalPlayTimeSeconds || 0;
        state.runPlayTimeSeconds = data.runPlayTimeSeconds || 0;
        // offline progress: short gaps (tab switch etc.) are added silently;
        // longer absences show a claimable "welcome back" summary instead
        if(data.lastTs){
          const dt = Math.min((Date.now()-data.lastTs)/1000, currentOfflineCapSeconds());
          if(dt > 45){
            const gain = totalRate()*dt;
            // defer showing until after the shop/stats/branches below are built
            setTimeout(() => showOfflineModal(gain, dt), 0);
          } else if(dt > 1){
            state.nutrients += totalRate()*dt;
            state.runEarned += totalRate()*dt;
          }
        }
      }
    }catch(e){ /* no save yet */ }
    backfillUnlockGaps();
    rebuildBranches(deriveLog(state.owned), false);
    buildShopOnce();
    updateShopAfford();
    updateStats();
    refreshAuraToggle();
  }

  // ---------- main loop ----------
  let last = performance.now();
  function tick(now){
    const dt = (now-last)/1000;
    last = now;
    const gain = totalRate()*dt;
    state.nutrients += gain;
    state.runEarned += gain;
    state.totalPlayTimeSeconds += dt;
    state.runPlayTimeSeconds += dt;
    updateStats();
    updateShopAfford();
    requestAnimationFrame(tick);
  }

  seedTrunk();
  render([]);
  load().then(()=>{
    requestAnimationFrame((t)=>{ last=t; requestAnimationFrame(tick); });
    setInterval(scheduleSave, 8000);
    setInterval(autoBuyOne, 2000);
    setInterval(checkAutoReset, 20000);
    scheduleNextEvent();
  });
})();
</script>
</body>
</html>
